[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

# API redirects - functions first (force=true ensures priority)
[[redirects]]
  from = "/api/validate-wiseapp-token"
  to = "/.netlify/functions/validate-wiseapp-token"
  status = 200
  force = true

[[redirects]]
  from = "/api/wiseapp/available-accounts"
  to = "/.netlify/functions/available-accounts"
  status = 200
  force = true

[[redirects]]
  from = "/api/cpf/:cpf"
  to = "/.netlify/functions/cpf"
  status = 200
  force = true

[[redirects]]
  from = "/api/vehicle-plate/:plate"
  to = "/.netlify/functions/vehicle-plate"
  status = 200
  force = true

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD"
    Access-Control-Allow-Headers = "Content-Type, Authorization, wiseapp-token, wiseapp-account-id, X-Requested-With, Accept, Origin, Cache-Control, Pragma, Expires, apikey, x-client-info, api_access_token"
    Access-Control-Allow-Credentials = "true"