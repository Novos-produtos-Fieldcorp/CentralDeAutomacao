[build]
  publish = "dist/public"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--production=false"

# Configuração das funções serverless
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  
# Configuração específica para a função API
[functions.api]
  node_bundler = "esbuild"

# Proxy para WiseApp API - MAIS ESPECÍFICO PRIMEIRO
[[redirects]]
  from = "/api/api/v1/*"
  to = "/.netlify/functions/api-simple/:splat"
  status = 200
  force = true

# Redirecionamentos para outras APIs
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redirecionamento para SPA (Single Page Application) - SEMPRE POR ÚLTIMO
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para APIs - sem cache
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Content-Security-Policy = "frame-ancestors *;"

# Headers para melhor performance e permitir iframe
[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors *;"

# Headers para assets estáticos
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para arquivos JavaScript e CSS
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"