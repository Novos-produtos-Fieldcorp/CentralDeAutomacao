[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "18"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Não usar funções Netlify - apenas Supabase Edge Functions
# [functions]
#   directory = "netlify/functions"
#   node_bundler = "esbuild"
#   included_files = ["netlify/functions/**"]

# Redirecionamento SPA - todas as rotas vão para index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD"
    Access-Control-Allow-Headers = "Content-Type, Authorization, wiseapp-token, wiseapp-account-id, X-Requested-With, Accept, Origin, Cache-Control, Pragma, Expires, apikey, x-client-info, api_access_token"
    Access-Control-Allow-Credentials = "true"