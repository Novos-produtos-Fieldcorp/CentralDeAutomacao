services:
  app:
    image: node:20-bookworm-slim
    container_name: central-automacao-dev
    working_dir: /app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 5000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - .:/app
      - central-automacao-node-modules:/app/node_modules
    command: sh ./scripts/docker-dev-start.sh

volumes:
  central-automacao-node-modules: