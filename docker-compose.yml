version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_CHAT_API_URL: ${VITE_CHAT_API_URL}
        VITE_CHAT_API_KEY: ${VITE_CHAT_API_KEY}
        VITE_CHAT_ACCOUNT_ID: ${VITE_CHAT_ACCOUNT_ID}
    ports:
      - "${PORT:-5000}:5000"
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_CHAT_API_URL=${VITE_CHAT_API_URL}
      - VITE_CHAT_API_KEY=${VITE_CHAT_API_KEY}
      - VITE_CHAT_ACCOUNT_ID=${VITE_CHAT_ACCOUNT_ID}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network

  # Optional: PostgreSQL database if you want to run it locally
  # Uncomment this section if you prefer local PostgreSQL over Supabase
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-centraldeautomacao}
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   ports:
  #     "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   restart: unless-stopped
  #   networks:
  #     - app-network

  # Optional: Redis for session storage
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

