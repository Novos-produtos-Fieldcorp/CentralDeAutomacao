
<div style="background: rgba(0,0,0,0.5); min-height: 420px; display: flex; align-items: center; justify-content: center; border-radius: var(--border-radius-lg); padding: 2rem;">
  <div style="background: #1a2235; border-radius: var(--border-radius-lg); padding: 1.5rem 2rem; width: 100%; max-width: 560px; border: 0.5px solid rgba(255,255,255,0.1);">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
      <div>
        <label style="font-size: 13px; color: #8a9bb5; display: block; margin-bottom: 6px;">Operação *</label>
        <div style="background: #243044; border: 0.5px solid rgba(255,255,255,0.1); border-radius: var(--border-radius-md); padding: 10px 12px; color: #8a9bb5; font-size: 14px; display: flex; justify-content: space-between; align-items: center;">
          Selecione uma operação <span style="font-size: 10px;">▼</span>
        </div>
      </div>
      <div>
        <label style="font-size: 13px; color: #8a9bb5; display: block; margin-bottom: 6px;">Status *</label>
        <div style="background: #243044; border: 0.5px solid rgba(255,255,255,0.1); border-radius: var(--border-radius-md); padding: 10px 12px; color: #8a9bb5; font-size: 14px; display: flex; justify-content: space-between; align-items: center;">
          Selecione um status <span style="font-size: 10px;">▼</span>
        </div>
      </div>
    </div>

    <div style="background: #243044; border-radius: var(--border-radius-md); padding: 1rem 1.25rem; border: 0.5px solid rgba(255,255,255,0.08); margin-bottom: 1rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <label style="font-size: 13px; color: #8a9bb5;">Distância Limite *</label>
        <span id="dist-val" style="font-size: 15px; font-weight: 500; color: #4f8ef7; background: rgba(79,142,247,0.12); padding: 2px 10px; border-radius: 20px; min-width: 64px; text-align: center;">50 km</span>
      </div>

      <input type="range" id="dist-slider" min="0" max="500" value="50" step="1"
        style="width: 100%; accent-color: #4f8ef7; height: 4px; cursor: pointer;" />

      <div style="display: flex; justify-content: space-between; margin-top: 6px;">
        <span style="font-size: 11px; color: #4a5a72;">0 km</span>
        <span style="font-size: 11px; color: #4a5a72;">250 km</span>
        <span style="font-size: 11px; color: #4a5a72;">500 km</span>
      </div>
    </div>

    <div>
      <label style="font-size: 13px; color: #8a9bb5; display: block; margin-bottom: 8px;">Dias de Trabalho * <span style="font-size: 11px; color: #4a5a72;">(clique para selecionar)</span></label>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <span style="background: #243044; color: #8a9bb5; border-radius: 20px; padding: 6px 14px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.1);">Segunda</span>
        <span style="background: #243044; color: #8a9bb5; border-radius: 20px; padding: 6px 14px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.1);">Terça</span>
        <span style="background: #243044; color: #8a9bb5; border-radius: 20px; padding: 6px 14px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.1);">Quarta</span>
        <span style="background: #243044; color: #8a9bb5; border-radius: 20px; padding: 6px 14px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.1);">Quinta</span>
        <span style="background: #243044; color: #8a9bb5; border-radius: 20px; padding: 6px 14px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.1);">Sexta</span>
        <span style="background: #243044; color: #8a9bb5; border-radius: 20px; padding: 6px 14px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.1);">Sábado</span>
        <span style="background: #243044; color: #8a9bb5; border-radius: 20px; padding: 6px 14px; font-size: 13px; border: 0.5px solid rgba(255,255,255,0.1);">Domingo</span>
      </div>
    </div>

  </div>
</div>

<script>
  const slider = document.getElementById('dist-slider');
  const val = document.getElementById('dist-val');
  slider.addEventListener('input', () => {
    const v = parseInt(slider.value);
    val.textContent = v === 0 ? 'Sem limite' : v + ' km';
    val.style.color = v === 0 ? '#8a9bb5' : '#4f8ef7';
    val.style.background = v === 0 ? 'rgba(138,155,181,0.1)' : 'rgba(79,142,247,0.12)';
  });
</script>
